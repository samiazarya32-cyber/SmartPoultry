<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Circuit Tech Grid & Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="16 8" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Futuristic Chicken / Rooster AI Silhouette with Filter Glow -->
  <g filter="url(#cyberGlow)">
    <!-- Comb (Red Cyber Crown) -->
    <path d="M 230 110 C 215 80, 245 60, 255 85 C 265 60, 295 70, 295 95 C 305 75, 335 90, 320 125 Z" fill="url(#combGrad)"/>

    <!-- Head & Neck -->
    <path d="M 230 120 C 270 110, 330 130, 330 180 C 330 220, 310 260, 310 300 C 310 340, 270 380, 200 380 C 130 380, 110 320, 130 270 C 145 235, 175 220, 210 210 C 235 200, 230 150, 230 120 Z" fill="url(#glowGrad)"/>

    <!-- Cyber Beak -->
    <polygon points="325,160 375,180 325,200" fill="url(#goldGrad)"/>

    <!-- Wattle -->
    <path d="M 310 210 C 330 230, 320 260, 300 255 C 290 250, 295 225, 310 210 Z" fill="url(#combGrad)"/>

    <!-- AI Eye Sensor -->
    <circle cx="285" cy="165" r="14" fill="#0f172a"/>
    <circle cx="285" cy="165" r="8" fill="#38bdf8"/>
    <circle cx="287" cy="163" r="3" fill="#ffffff"/>

    <!-- Cyber Wing Details / Data Nodes -->
    <path d="M 160 280 Q 210 260 260 310 Q 200 350 160 280 Z" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
    <path d="M 185 300 Q 230 290 260 330" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Futuristic AI Node Dots -->
  <circle cx="160" cy="280" r="6" fill="#34d399"/>
  <circle cx="260" cy="310" r="6" fill="#38bdf8"/>
  <circle cx="210" cy="210" r="5" fill="#fbbf24"/>
  <circle cx="200" cy="380" r="7" fill="#10b981"/>

  <!-- Pulse Status Ring -->
  <circle cx="410" cy="100" r="28" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
  <circle cx="410" cy="100" r="14" fill="#10b981"/>
  <circle cx="410" cy="100" r="6" fill="#ffffff"/>
</svg>
